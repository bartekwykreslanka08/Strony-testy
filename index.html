<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Zgadnij Miasto 🌍</title>


<style>

/* =====================================================
   MOTYW
===================================================== */

:root {

  --bg: #f3f5f7;

  --card: #ffffff;

  --text: #111827;

  --muted: #667085;

  --border: #e4e7ec;

  --input: #ffffff;

  --soft: #f2f4f7;

  --button: #111827;

  --buttonText: #ffffff;

  --successBg: #dcfce7;

  --successText: #166534;

  --errorBg: #fee2e2;

  --errorText: #991b1b;

}


body.dark {

  --bg: #0b0f14;

  --card: #151a21;

  --text: #f3f4f6;

  --muted: #9ca3af;

  --border: #29313d;

  --input: #10151c;

  --soft: #202731;

  --button: #f3f4f6;

  --buttonText: #111827;

  --successBg: #12351f;

  --successText: #86efac;

  --errorBg: #3b1717;

  --errorText: #fca5a5;

}


* {

  box-sizing: border-box;

}


body {

  margin: 0;

  background: var(--bg);

  color: var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  transition:
    background .25s,
    color .25s;

}


/* =====================================================
   HEADER
===================================================== */

header {

  position: sticky;

  top: 0;

  z-index: 100;

  background:
    color-mix(
      in srgb,
      var(--card) 94%,
      transparent
    );

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid var(--border);

}


.header-inner {

  max-width: 1000px;

  margin: auto;

  padding:
    12px 16px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

}


.logo {

  font-size: 20px;

  font-weight: 900;

}


.header-right {

  display: flex;

  align-items: center;

  gap: 7px;

}


.stats {

  display: flex;

  gap: 5px;

}


.stat {

  background: var(--soft);

  border: 1px solid var(--border);

  padding:
    7px 9px;

  border-radius: 11px;

  font-size: 12px;

  font-weight: 900;

}


.theme-btn {

  border: 1px solid var(--border);

  background: var(--soft);

  color: var(--text);

  width: 38px;

  height: 38px;

  border-radius: 11px;

  cursor: pointer;

  font-size: 18px;

}


/* =====================================================
   MAIN
===================================================== */

main {

  max-width: 950px;

  margin:
    25px auto;

  padding:
    0 15px 50px;

}


/* =====================================================
   START
===================================================== */

.start {

  background: var(--card);

  border:
    1px solid var(--border);

  border-radius: 25px;

  padding:
    55px 25px;

  text-align: center;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.06);

}


.start-icon {

  font-size: 65px;

}


.start h1 {

  font-size: 42px;

  margin:
    10px 0;

}


.start p {

  color: var(--muted);

  max-width: 560px;

  margin:
    0 auto 25px;

  line-height: 1.6;

}


select {

  width: 100%;

  max-width: 320px;

  padding: 14px;

  border:
    1px solid var(--border);

  border-radius: 13px;

  background: var(--input);

  color: var(--text);

  font-size: 15px;

}


.start-button {

  margin-top: 15px;

  padding:
    15px 25px;

  border: 0;

  border-radius: 14px;

  background: var(--button);

  color: var(--buttonText);

  font-weight: 900;

  cursor: pointer;

}


.reset-button {

  display: block;

  margin:
    15px auto 0;

  border: 0;

  background: transparent;

  color: var(--muted);

  text-decoration: underline;

  cursor: pointer;

}


/* =====================================================
   GAME
===================================================== */

.game {

  display: none;

  overflow: hidden;

  background: var(--card);

  border:
    1px solid var(--border);

  border-radius: 25px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.07);

}


.image-box {

  height: 450px;

  position: relative;

  background:
    var(--soft);

}


#cityImage {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: none;

}


.image-placeholder {

  width: 100%;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  color: var(--muted);

}


.image-placeholder div {

  font-size: 65px;

  margin-bottom: 10px;

}


.loading {

  position: absolute;

  inset: 0;

  z-index: 10;

  background:
    var(--card);

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 10px;

}


.spinner {

  width: 38px;

  height: 38px;

  border:
    4px solid var(--border);

  border-top-color:
    var(--text);

  border-radius: 50%;

  animation:
    spin .8s linear infinite;

}


@keyframes spin {

  to {

    transform:
      rotate(360deg);

  }

}


.credit {

  position: absolute;

  bottom: 10px;

  right: 10px;

  padding:
    6px 9px;

  border-radius: 8px;

  color: white;

  background:
    rgba(0,0,0,.65);

  font-size: 11px;

}


/* =====================================================
   TIMER
===================================================== */

.timer {

  height: 6px;

  background:
    var(--border);

}


.timer-bar {

  width: 100%;

  height: 100%;

  background:
    var(--button);

  transition:
    width 1s linear;

}


/* =====================================================
   CONTENT
===================================================== */

.content {

  padding: 27px;

}


.question {

  font-size: 27px;

  font-weight: 900;

  margin-bottom: 20px;

}


.hints {

  display: grid;

  gap: 10px;

}


.hint {

  display: none;

  padding: 15px;

  border:
    1px solid var(--border);

  border-radius: 14px;

  background:
    var(--soft);

  line-height: 1.5;

}


.hint.show {

  display: block;

}


.answer-row {

  display: flex;

  gap: 10px;

  margin-top: 18px;

}


#answer {

  flex: 1;

  min-width: 0;

  padding: 15px;

  border:
    2px solid var(--border);

  border-radius: 14px;

  background: var(--input);

  color: var(--text);

  font-size: 16px;

  outline: none;

}


#answer:focus {

  border-color:
    var(--text);

}


button {

  font-family: inherit;

}


.main-button {

  border: 0;

  border-radius: 14px;

  padding:
    14px 19px;

  font-weight: 900;

  cursor: pointer;

}


.check {

  background:
    var(--button);

  color:
    var(--buttonText);

}


.hint-button {

  width: 100%;

  margin-top: 10px;

  background:
    var(--soft);

  color:
    var(--text);

}


.result {

  display: none;

  margin-top: 15px;

  padding: 15px;

  border-radius: 14px;

  line-height: 1.5;

  font-weight: 800;

}


.result.correct {

  display: block;

  background:
    var(--successBg);

  color:
    var(--successText);

}


.result.wrong {

  display: block;

  background:
    var(--errorBg);

  color:
    var(--errorText);

}


.next {

  display: none;

  width: 100%;

  margin-top: 12px;

  background:
    #2563eb;

  color: white;

}


.menu {

  display: none;

  width: 100%;

  margin-top: 10px;

  background:
    var(--soft);

  color:
    var(--text);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px) {

  .logo {

    font-size: 15px;

  }


  .stats {

    gap: 3px;

  }


  .stat {

    padding:
      6px 7px;

    font-size: 10px;

  }


  .image-box {

    height: 300px;

  }


  .start {

    padding:
      40px 18px;

  }


  .start h1 {

    font-size: 32px;

  }


  .content {

    padding: 20px;

  }


  .question {

    font-size: 22px;

  }


  .answer-row {

    flex-direction: column;

  }


  .check {

    width: 100%;

  }

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      🌍 Zgadnij Miasto
    </div>


    <div class="header-right">

      <div class="stats">

        <div class="stat">
          🎯 <span id="score">0</span>
        </div>

        <div class="stat">
          🔥 <span id="streak">0</span>
        </div>

        <div class="stat">
          ⏱️ <span id="time">60</span>
        </div>

      </div>


      <button
        class="theme-btn"
        id="themeButton"
        onclick="toggleTheme()"
      >
        🌙
      </button>

    </div>

  </div>

</header>


<main>


<!-- ===================================================
 START
=================================================== -->

<section
  class="start"
  id="startScreen"
>

  <div class="start-icon">
    🌍
  </div>


  <h1>
    Zgadnij Miasto
  </h1>


  <p>
    Zobacz zdjęcie, przeczytaj trzy losowe
    podpowiedzi i zgadnij miasto!
  </p>


  <select id="mode">

    <option value="world">
      🌍 Cały świat
    </option>

    <option value="europe">
      🇪🇺 Europa
    </option>

    <option value="poland">
      🇵🇱 Polska
    </option>

  </select>


  <br>


  <button
    class="start-button"
    onclick="startGame()"
  >
    🎮 ROZPOCZNIJ GRĘ
  </button>


  <button
    class="reset-button"
    onclick="resetScore()"
  >
    Wyzeruj wynik
  </button>

</section>


<!-- ===================================================
 GAME
=================================================== -->

<section
  class="game"
  id="game"
>


  <div class="image-box">


    <img
      id="cityImage"
      alt="Zdjęcie miasta"
    >


    <div
      class="image-placeholder"
      id="placeholder"
    >

      <div>
        🏙️
      </div>

      <strong>
        Ładowanie zdjęcia...
      </strong>

    </div>


    <div
      class="loading"
      id="loading"
    >

      <div class="spinner"></div>

      <strong>
        Losowanie miasta...
      </strong>

    </div>


    <div
      class="credit"
      id="credit"
      style="display:none"
    >
      Wikimedia Commons
    </div>


  </div>


  <div class="timer">

    <div
      class="timer-bar"
      id="timerBar"
    ></div>

  </div>


  <div class="content">


    <div class="question">
      🧐 Jakie to miasto?
    </div>


    <div class="hints">

      <div
        class="hint"
        id="hint1"
      >
        💡 1.
        <span></span>
      </div>


      <div
        class="hint"
        id="hint2"
      >
        💡 2.
        <span></span>
      </div>


      <div
        class="hint"
        id="hint3"
      >
        💡 3.
        <span></span>
      </div>

    </div>


    <div class="answer-row">

      <input
        id="answer"
        type="text"
        placeholder="Wpisz nazwę miasta..."
        autocomplete="off"
      >


      <button
        class="main-button check"
        id="checkButton"
        onclick="checkAnswer()"
      >
        SPRAWDŹ
      </button>

    </div>


    <button
      class="main-button hint-button"
      id="hintButton"
      onclick="showHint()"
    >
      💡 POKAŻ PODPOWIEDŹ
    </button>


    <div
      class="result"
      id="result"
    ></div>


    <button
      class="main-button next"
      id="nextButton"
      onclick="nextCity()"
    >
      NASTĘPNE MIASTO →
    </button>


    <button
      class="main-button menu"
      id="menuButton"
      onclick="backToMenu()"
    >
      ← MENU

    </button>


  </div>

</section>


</main>


<script>

/* =====================================================
 WORKER
===================================================== */

const WORKER =
  "https://zgadnij-miasto-api.papierzowyroblox.workers.dev";


/* =====================================================
 LOCAL STORAGE
===================================================== */

let score =
  Number(
    localStorage.getItem(
      "zgadnijMiasto_score"
    )
  ) || 0;


let streak =
  Number(
    localStorage.getItem(
      "zgadnijMiasto_streak"
    )
  ) || 0;


let theme =
  localStorage.getItem(
    "zgadnijMiasto_theme"
  ) || "light";


/* =====================================================
 GAME VARIABLES
===================================================== */

let city = null;

let hintsUsed = 0;

let timeLeft = 60;

let timer = null;

let running = false;


/* =====================================================
 ELEMENTS
===================================================== */

const scoreEl =
  document.getElementById("score");

const streakEl =
  document.getElementById("streak");

const timeEl =
  document.getElementById("time");

const startScreen =
  document.getElementById("startScreen");

const game =
  document.getElementById("game");

const loading =
  document.getElementById("loading");

const cityImage =
  document.getElementById("cityImage");

const placeholder =
  document.getElementById("placeholder");

const credit =
  document.getElementById("credit");

const answer =
  document.getElementById("answer");

const checkButton =
  document.getElementById("checkButton");

const hintButton =
  document.getElementById("hintButton");

const result =
  document.getElementById("result");

const nextButton =
  document.getElementById("nextButton");

const menuButton =
  document.getElementById("menuButton");

const timerBar =
  document.getElementById("timerBar");


/* =====================================================
 THEME
===================================================== */

function applyTheme() {

  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  document.getElementById(
    "themeButton"
  ).innerText =
    theme === "dark"
      ? "☀️"
      : "🌙";

}


function toggleTheme() {

  theme =
    theme === "dark"
      ? "light"
      : "dark";


  localStorage.setItem(
    "zgadnijMiasto_theme",
    theme
  );


  applyTheme();

}


applyTheme();


/* =====================================================
 STATS
===================================================== */

function saveStats() {

  localStorage.setItem(
    "zgadnijMiasto_score",
    score
  );

  localStorage.setItem(
    "zgadnijMiasto_streak",
    streak
  );

}


function updateStats() {

  scoreEl.innerText =
    score;

  streakEl.innerText =
    streak;

  timeEl.innerText =
    timeLeft;

}


/* =====================================================
 NORMALIZACJA
===================================================== */

function normalize(text) {

  return String(text)
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /ł/g,
      "l"
    )
    .trim()
    .replace(
      /\s+/g,
      " "
    );

}


/* =====================================================
 START
===================================================== */

async function startGame() {

  startScreen.style.display =
    "none";

  game.style.display =
    "block";

  await loadCity();

}


/* =====================================================
 LOAD CITY
===================================================== */

async function loadCity() {

  clearInterval(timer);

  running = false;

  city = null;

  hintsUsed = 0;

  timeLeft = 60;

  updateStats();


  loading.style.display =
    "flex";

  loading.innerHTML = `
    <div class="spinner"></div>
    <strong>
      Losowanie miasta...
    </strong>
  `;


  cityImage.style.display =
    "none";

  cityImage.removeAttribute(
    "src"
  );


  placeholder.style.display =
    "flex";


  credit.style.display =
    "none";


  result.className =
    "result";

  result.innerHTML =
    "";


  nextButton.style.display =
    "none";

  menuButton.style.display =
    "none";


  checkButton.disabled =
    true;

  hintButton.disabled =
    true;


  answer.value =
    "";


  for(
    let i = 1;
    i <= 3;
    i++
  ) {

    const el =
      document.getElementById(
        "hint" + i
      );


    el.classList.remove(
      "show"
    );


    el.querySelector(
      "span"
    ).innerText =
      "";

  }


  const mode =
    document.getElementById(
      "mode"
    ).value;


  try {

    const response =
      await fetch(
        WORKER +
        "/api/city?mode=" +
        encodeURIComponent(mode) +
        "&random=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ) {

      throw new Error(
        "Worker HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok ||
      !data.city ||
      !Array.isArray(
        data.hints
      )
    ) {

      throw new Error(
        "Nieprawidłowa odpowiedź API."
      );

    }


    city =
      data;


    /* ===============================
       HINTS
    =============================== */

    data.hints
      .slice(0,3)
      .forEach(
        (hint,index) => {

          const el =
            document.getElementById(
              "hint" +
              (index + 1)
            );


          el.querySelector(
            "span"
          ).innerText =
            hint;

        }
      );


    /* ===============================
       IMAGE
    =============================== */

    if(data.image) {

      cityImage.onload =
        () => {

          cityImage.style.display =
            "block";

          placeholder.style.display =
            "none";

          loading.style.display =
            "none";

        };


      cityImage.onerror =
        async () => {

          cityImage.style.display =
            "none";

          placeholder.style.display =
            "flex";

          loading.style.display =
            "none";

        };


      cityImage.src =
        data.image;


      credit.innerText =
        data.credit ||
        "Wikimedia Commons";


      credit.style.display =
        "block";

    } else {

      loading.style.display =
        "none";

    }


    if(!data.image) {

      loading.style.display =
        "none";

    }


    checkButton.disabled =
      false;

    hintButton.disabled =
      false;


    running =
      true;


    startTimer();


    answer.focus();


  } catch(error) {

    loading.innerHTML = `

      <div style="
        font-size:45px;
      ">
        ❌
      </div>

      <strong>
        Nie udało się pobrać miasta
      </strong>

      <small style="
        color:var(--muted);
        margin-top:5px;
        text-align:center;
      ">
        ${escapeHtml(
          error.message
        )}
      </small>

      <button
        onclick="loadCity()"
        style="
          margin-top:12px;
          padding:12px 18px;
          border:0;
          border-radius:12px;
          background:var(--button);
          color:var(--buttonText);
          font-weight:900;
          cursor:pointer;
        "
      >
        SPRÓBUJ PONOWNIE
      </button>

    `;

  }

}


/* =====================================================
 TIMER
===================================================== */

function startTimer() {

  clearInterval(timer);

  timeLeft = 60;

  timerBar.style.width =
    "100%";


  timer =
    setInterval(
      () => {

        if(!running)
          return;


        timeLeft--;

        updateStats();


        timerBar.style.width =
          (
            timeLeft / 60 * 100
          ) + "%";


        if(
          timeLeft <= 0
        ) {

          timeout();

        }

      },
      1000
    );

}


/* =====================================================
 SHOW HINT
===================================================== */

function showHint() {

  if(!running)
    return;


  if(
    hintsUsed >= 3
  )
    return;


  hintsUsed++;


  document
    .getElementById(
      "hint" +
      hintsUsed
    )
    .classList.add(
      "show"
    );


  if(
    hintsUsed >= 3
  ) {

    hintButton.disabled =
      true;

  }

}


/* =====================================================
 CHECK
===================================================== */

function checkAnswer() {

  if(!running)
    return;


  const value =
    normalize(
      answer.value
    );


  if(!value) {

    answer.focus();

    return;

  }


  if(
    value ===
    normalize(city.city)
  ) {

    correct();

  } else {

    wrong();

  }

}


/* =====================================================
 CORRECT
===================================================== */

function correct() {

  running = false;

  clearInterval(timer);


  let points = 100;


  if(
    hintsUsed === 1
  ) {

    points = 75;

  }


  if(
    hintsUsed === 2
  ) {

    points = 50;

  }


  if(
    hintsUsed === 3
  ) {

    points = 25;

  }


  if(
    timeLeft >= 45
  ) {

    points += 20;

  }
  else if(
    timeLeft >= 30
  ) {

    points += 10;

  }


  score += points;

  streak++;


  saveStats();

  updateStats();


  result.className =
    "result correct";


  result.innerHTML = `
    🎉 Brawo!<br>
    Poprawna odpowiedź:
    <strong>
      ${escapeHtml(city.city)}
    </strong>
    <br>
    +${points} punktów!
  `;


  checkButton.disabled =
    true;

  hintButton.disabled =
    true;


  nextButton.style.display =
    "block";

  menuButton.style.display =
    "block";

}


/* =====================================================
 WRONG
===================================================== */

function wrong() {

  result.className =
    "result wrong";


  result.innerHTML =
    "❌ Nie tym razem! Spróbuj ponownie.";


  answer.select();

}


/* =====================================================
 TIMEOUT
===================================================== */

function timeout() {

  running = false;

  clearInterval(timer);


  streak = 0;


  saveStats();

  updateStats();


  result.className =
    "result wrong";


  result.innerHTML = `
    ⏰ Koniec czasu!<br>
    Poprawna odpowiedź:
    <strong>
      ${escapeHtml(city.city)}
    </strong>
  `;


  checkButton.disabled =
    true;

  hintButton.disabled =
    true;


  for(
    let i = 1;
    i <= 3;
    i++
  ) {

    document
      .getElementById(
        "hint" + i
      )
      .classList.add(
        "show"
      );

  }


  nextButton.style.display =
    "block";

  menuButton.style.display =
    "block";

}


/* =====================================================
 NEXT
===================================================== */

async function nextCity() {

  await loadCity();

}


/* =====================================================
 MENU
===================================================== */

function backToMenu() {

  clearInterval(timer);

  running = false;

  game.style.display =
    "none";

  startScreen.style.display =
    "block";

  saveStats();

  updateStats();

}


/* =====================================================
 RESET
===================================================== */

function resetScore() {

  if(
    !confirm(
      "Na pewno wyzerować wynik i serię?"
    )
  )
    return;


  score = 0;

  streak = 0;


  saveStats();

  updateStats();

}


/* =====================================================
 ENTER
===================================================== */

answer.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      checkAnswer();

    }

  }
);


/* =====================================================
 ESCAPE
===================================================== */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
 INITIAL
===================================================== */

updateStats();
