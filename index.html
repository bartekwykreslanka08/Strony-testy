<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zgadnij Miasto 🌍</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #111827;
    --muted: #667085;
    --border: #e5e7eb;
    --dark: #111827;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font-family: inherit;
}

header {
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 21px;
    font-weight: 900;
    white-space: nowrap;
}

.stats {
    display: flex;
    gap: 7px;
}

.stat {
    background: #f1f3f5;
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
}

main {
    width: 100%;
    max-width: 950px;
    margin: 25px auto;
    padding: 0 15px 50px;
}

/* START */

.start-screen {
    background: var(--card);
    border-radius: 25px;
    padding: 55px 25px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(0,0,0,.07);
}

.start-icon {
    font-size: 65px;
    margin-bottom: 10px;
}

.start-screen h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 900;
}

.start-screen p {
    max-width: 550px;
    margin: 15px auto 30px;
    color: var(--muted);
    line-height: 1.6;
}

.mode-select {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 18px;
}

.mode-select select {
    width: 100%;
    border: 2px solid var(--border);
    background: white;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    outline: none;
}

.start-btn {
    background: var(--dark);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px 28px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
}

.start-btn:hover {
    transform: translateY(-1px);
}

/* GAME */

.game-card {
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,.07);
}

.image-container {
    height: 450px;
    background: #e9ecef;
    position: relative;
    overflow: hidden;
}

#cityImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.image-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 30% 20%, #ffffff, transparent 30%),
        linear-gradient(135deg, #e9ecef, #dfe3e8);
    color: #667085;
    text-align: center;
    padding: 20px;
}

.image-placeholder .big {
    font-size: 70px;
    margin-bottom: 12px;
}

.image-placeholder strong {
    font-size: 20px;
    color: #344054;
}

.loading {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
}

.spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #e5e7eb;
    border-top-color: #111827;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.image-credit {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 6px 9px;
    border-radius: 8px;
    background: rgba(0,0,0,.65);
    color: white;
    font-size: 11px;
    z-index: 3;
}

/* TIMER */

.timer {
    height: 6px;
    background: #e5e7eb;
}

.timer-bar {
    height: 100%;
    width: 100%;
    background: #111827;
    transition: width 1s linear;
}

/* CONTENT */

.content {
    padding: 27px;
}

.question {
    font-size: 27px;
    font-weight: 900;
    margin-bottom: 20px;
}

.hints {
    display: grid;
    gap: 10px;
    margin-bottom: 18px;
}

.hint {
    display: none;
    background: #f7f8fa;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px;
    line-height: 1.45;
}

.hint.visible {
    display: block;
    animation: appear .2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(-4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hint-number {
    font-weight: 900;
    margin-right: 6px;
}

.answer-row {
    display: flex;
    gap: 10px;
}

#answer {
    flex: 1;
    min-width: 0;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 15px;
    font-size: 16px;
    outline: none;
}

#answer:focus {
    border-color: #111827;
}

.main-btn {
    border: none;
    border-radius: 14px;
    padding: 15px 20px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
}

#checkBtn {
    background: var(--dark);
    color: white;
}

#hintBtn {
    width: 100%;
    margin-top: 10px;
    background: #eef0f2;
    color: var(--text);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result {
    display: none;
    margin-top: 15px;
    padding: 16px;
    border-radius: 14px;
    font-weight: 800;
    line-height: 1.45;
}

.result.correct {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.result.wrong {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.next-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    background: var(--blue);
    color: white;
}

.back-btn {
    display: none;
    width: 100%;
    margin-top: 10px;
    background: #eef0f2;
    color: #111827;
}

/* MOBILE */

@media(max-width: 650px) {

    .header-inner {
        padding: 12px;
    }

    .logo {
        font-size: 16px;
    }

    .stats {
        gap: 4px;
    }

    .stat {
        padding: 7px 8px;
        font-size: 11px;
    }

    main {
        margin-top: 15px;
    }

    .start-screen {
        padding: 40px 18px;
    }

    .start-screen h1 {
        font-size: 32px;
    }

    .image-container {
        height: 300px;
    }

    .content {
        padding: 20px;
    }

    .question {
        font-size: 22px;
    }

    .answer-row {
        flex-direction: column;
    }

    #checkBtn {
        width: 100%;
    }

    .image-placeholder .big {
        font-size: 55px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            🌍 Zgadnij Miasto
        </div>

        <div class="stats">

            <div class="stat">
                🎯 <span id="score">0</span>
            </div>

            <div class="stat">
                🔥 <span id="streak">0</span>
            </div>

            <div class="stat">
                ⏱️ <span id="time">60</span>
            </div>

        </div>

    </div>

</header>


<main>

    <!-- START -->

    <section id="startScreen" class="start-screen">

        <div class="start-icon">
            🌍
        </div>

        <h1>Zgadnij Miasto</h1>

        <p>
            Zobacz zdjęcie, przeczytaj podpowiedzi
            i zgadnij, jakie miasto ukrywa się za pytaniem!
        </p>

        <div class="mode-select">

            <select id="mode">

                <option value="world">
                    🌍 Cały świat
                </option>

                <option value="poland">
                    🇵🇱 Polska
                </option>

                <option value="europe">
                    🇪🇺 Europa
                </option>

            </select>

        </div>

        <button
            class="start-btn"
            onclick="startGame()"
        >
            🎮 ROZPOCZNIJ GRĘ
        </button>

    </section>


    <!-- GAME -->

    <section
        id="game"
        class="game-card"
        style="display:none"
    >

        <div class="image-container">

            <img
                id="cityImage"
                alt="Zdjęcie miasta"
            >

            <div
                id="imagePlaceholder"
                class="image-placeholder"
            >

                <div class="big">
                    🏙️
                </div>

                <strong>
                    Brak zdjęcia
                </strong>

                <span>
                    Miasto można nadal odgadnąć z podpowiedzi.
                </span>

            </div>


            <div
                id="loading"
                class="loading"
            >

                <div class="spinner"></div>

                <div>
                    Losowanie miasta...
                </div>

            </div>


            <div
                id="credit"
                class="image-credit"
                style="display:none"
            >
                Wikimedia Commons
            </div>

        </div>


        <div class="timer">

            <div
                id="timerBar"
                class="timer-bar"
            ></div>

        </div>


        <div class="content">

            <div class="question">
                🧐 Jakie to miasto?
            </div>


            <div class="hints">

                <div
                    id="hint1"
                    class="hint"
                >
                    <span class="hint-number">
                        💡 1.
                    </span>

                    <span class="hint-text"></span>
                </div>


                <div
                    id="hint2"
                    class="hint"
                >
                    <span class="hint-number">
                        💡 2.
                    </span>

                    <span class="hint-text"></span>
                </div>


                <div
                    id="hint3"
                    class="hint"
                >
                    <span class="hint-number">
                        💡 3.
                    </span>

                    <span class="hint-text"></span>
                </div>

            </div>


            <div class="answer-row">

                <input
                    id="answer"
                    type="text"
                    placeholder="Wpisz nazwę miasta..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="checkBtn"
                    class="main-btn"
                    onclick="checkAnswer()"
                >
                    SPRAWDŹ
                </button>

            </div>


            <button
                id="hintBtn"
                class="main-btn"
                onclick="showHint()"
            >
                💡 POKAŻ PODPOWIEDŹ
            </button>


            <div
                id="result"
                class="result"
            ></div>


            <button
                id="nextBtn"
                class="main-btn next-btn"
                onclick="nextRound()"
            >
                NASTĘPNE MIASTO →
            </button>


            <button
                id="backBtn"
                class="main-btn back-btn"
                onclick="backToStart()"
            >
                ← MENU GŁÓWNE
            </button>

        </div>

    </section>

</main>


<script>

/*
==================================================
  TUTAJ WKLEJ ADRES SWOJEGO CLOUDFLARE WORKERA
==================================================
*/

const WORKER_URL =
    "zgadnij-miasto-api.papierzowyroblox.workers.dev";


let currentCity = null;

let score = 0;

let streak = 0;

let hintsUsed = 0;

let timeLeft = 60;

let timerInterval = null;

let gameRunning = false;


/*
==================================================
  ELEMENTY
==================================================
*/

const startScreen =
    document.getElementById("startScreen");

const game =
    document.getElementById("game");

const cityImage =
    document.getElementById("cityImage");

const imagePlaceholder =
    document.getElementById("imagePlaceholder");

const loading =
    document.getElementById("loading");

const credit =
    document.getElementById("credit");

const answer =
    document.getElementById("answer");

const checkBtn =
    document.getElementById("checkBtn");

const hintBtn =
    document.getElementById("hintBtn");

const result =
    document.getElementById("result");

const nextBtn =
    document.getElementById("nextBtn");

const backBtn =
    document.getElementById("backBtn");

const timerBar =
    document.getElementById("timerBar");


/*
==================================================
  NORMALIZACJA TEKSTU
==================================================
*/

function normalize(text) {

    return String(text)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[łŁ]/g, "l")
        .trim()
        .replace(/\s+/g, " ");

}


/*
==================================================
  START
==================================================
*/

async function startGame() {

    score = 0;

    streak = 0;

    updateStats();

    startScreen.style.display = "none";

    game.style.display = "block";

    await loadCity();

}


/*
==================================================
  ŁADOWANIE MIASTA
==================================================
*/

async function loadCity() {

    clearInterval(timerInterval);

    gameRunning = false;

    currentCity = null;

    hintsUsed = 0;

    loading.style.display = "flex";

    loading.innerHTML = `
        <div class="spinner"></div>
        <div>Losowanie miasta...</div>
    `;

    result.className = "result";

    result.innerHTML = "";

    nextBtn.style.display = "none";

    backBtn.style.display = "none";

    checkBtn.disabled = true;

    hintBtn.disabled = true;

    answer.value = "";

    /*
      Ukrywanie podpowiedzi
    */

    for(let i = 1; i <= 3; i++) {

        const hint =
            document.getElementById("hint" + i);

        hint.classList.remove("visible");

        hint.querySelector(".hint-text")
            .innerText = "";

    }


    /*
      Reset zdjęcia
    */

    cityImage.style.display = "none";

    cityImage.removeAttribute("src");

    imagePlaceholder.style.display = "flex";

    credit.style.display = "none";


    /*
      Pobranie trybu
    */

    const mode =
        document.getElementById("mode").value;


    /*
      Sprawdzenie adresu Workera
    */

    if(
        !WORKER_URL ||
        WORKER_URL.includes("TU_WKLEJ")
    ) {

        showApiError(
            "Nie ustawiono adresu Cloudflare Workera."
        );

        return;

    }


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/city?mode=" +
                encodeURIComponent(mode),
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok) {

            throw new Error(
                "Worker zwrócił HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
          Sprawdzamy odpowiedź API
        */

        if(!data.ok) {

            throw new Error(
                data.error ||
                "API zwróciło błąd."
            );

        }


        if(
            !data.city ||
            !Array.isArray(data.hints) ||
            data.hints.length < 3
        ) {

            throw new Error(
                "API nie zwróciło kompletnego miasta."
            );

        }


        currentCity = data;


        /*
        ==========================================
          PODPOWIEDZI
        ==========================================
        */

        document
            .getElementById("hint1")
            .querySelector(".hint-text")
            .innerText =
            data.hints[0];

        document
            .getElementById("hint2")
            .querySelector(".hint-text")
            .innerText =
            data.hints[1];

        document
            .getElementById("hint3")
            .querySelector(".hint-text")
            .innerText =
            data.hints[2];


        /*
        ==========================================
          ZDJĘCIE
        ==========================================
        */

        if(data.image) {

            cityImage.src = data.image;

            cityImage.style.display = "block";

            imagePlaceholder.style.display = "none";

            credit.innerText =
                data.credit ||
                "Wikimedia Commons";

            credit.style.display = "block";

        } else {

            /*
              Brak zdjęcia NIE jest błędem.
            */

            cityImage.style.display = "none";

            imagePlaceholder.style.display = "flex";

        }


        loading.style.display = "none";

        checkBtn.disabled = false;

        hintBtn.disabled = false;

        gameRunning = true;

        answer.focus();

        startTimer();


    } catch(error) {

        console.error(
            "Błąd gry:",
            error
        );

        showApiError(
            error.message ||
            "Nie udało się pobrać miasta."
        );

    }

}


/*
==================================================
  BŁĄD API
==================================================
*/

function showApiError(message) {

    loading.style.display = "flex";

    loading.innerHTML = `
        <div style="
            font-size:42px;
            margin-bottom:10px;
        ">
            ❌
        </div>

        <strong>
            Nie udało się pobrać miasta
        </strong>

        <div style="
            margin-top:8px;
            max-width:500px;
            text-align:center;
            color:#667085;
            font-size:13px;
        ">
            ${escapeHtml(message)}
        </div>

        <button
            onclick="loadCity()"
            style="
                margin-top:15px;
                padding:12px 18px;
                border:0;
                border-radius:12px;
                background:#111827;
                color:white;
                font-weight:800;
                cursor:pointer;
            "
        >
            SPRÓBUJ PONOWNIE
        </button>
    `;

    checkBtn.disabled = true;

    hintBtn.disabled = true;

    gameRunning = false;

}


/*
==================================================
  ESCAPE HTML
==================================================
*/

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
==================================================
  PODPOWIEDZI
==================================================
*/

function showHint() {

    if(!gameRunning) {
        return;
    }

    if(hintsUsed >= 3) {
        return;
    }

    hintsUsed++;

    const hint =
        document.getElementById(
            "hint" + hintsUsed
        );

    hint.classList.add("visible");


    if(hintsUsed >= 3) {

        hintBtn.disabled = true;

    }

}


/*
==================================================
  SPRAWDZANIE ODPOWIEDZI
==================================================
*/

function checkAnswer() {

    if(!gameRunning) {
        return;
    }

    const userAnswer =
        normalize(answer.value);


    if(!userAnswer) {

        answer.focus();

        return;

    }


    const correctAnswer =
        normalize(currentCity.city);


    if(userAnswer === correctAnswer) {

        correctAnswerHandler();

    } else {

        wrongAnswerHandler();

    }

}


/*
==================================================
  POPRAWNA ODPOWIEDŹ
==================================================
*/

function correctAnswerHandler() {

    gameRunning = false;

    clearInterval(timerInterval);


    let points = 100;


    if(hintsUsed === 1) {
        points = 75;
    }

    if(hintsUsed === 2) {
        points = 50;
    }

    if(hintsUsed === 3) {
        points = 25;
    }


    /*
      Bonus za czas
    */

    if(timeLeft >= 45) {

        points += 20;

    } else if(timeLeft >= 30) {

        points += 10;

    }


    score += points;

    streak++;


    updateStats();


    result.className =
        "result correct";


    result.innerHTML = `
        🎉 <strong>Brawo!</strong><br>
        To było miasto:
        <strong>${escapeHtml(currentCity.city)}</strong>
        <br>
        +${points} punktów!
    `;


    checkBtn.disabled = true;

    hintBtn.disabled = true;

    nextBtn.style.display = "block";

    backBtn.style.display = "block";

}


/*
==================================================
  ZŁA ODPOWIEDŹ
==================================================
*/

function wrongAnswerHandler() {

    streak = 0;

    updateStats();


    result.className =
        "result wrong";


    result.innerHTML =
        "❌ Nie tym razem! Spróbuj jeszcze raz.";


    answer.select();

}


/*
==================================================
  TIMER
==================================================
*/

function startTimer() {

    clearInterval(timerInterval);

    timeLeft = 60;

    timerBar.style.width = "100%";

    updateStats();


    timerInterval = setInterval(() => {

        if(!gameRunning) {
            return;
        }

        timeLeft--;

        updateStats();


        timerBar.style.width =
            (timeLeft / 60 * 100) +
            "%";


        if(timeLeft <= 0) {

            timeOut();

        }

    }, 1000);

}


/*
==================================================
  KONIEC CZASU
==================================================
*/

function timeOut() {

    gameRunning = false;

    clearInterval(timerInterval);

    streak = 0;

    updateStats();


    result.className =
        "result wrong";


    result.innerHTML = `
        ⏰ <strong>Koniec czasu!</strong><br>
        Poprawna odpowiedź:
        <strong>${escapeHtml(currentCity.city)}</strong>
    `;


    checkBtn.disabled = true;

    hintBtn.disabled = true;

    nextBtn.style.display = "block";

    backBtn.style.display = "block";


    /*
      Pokaż wszystkie podpowiedzi
    */

    for(let i = 1; i <= 3; i++) {

        document
            .getElementById("hint" + i)
            .classList.add("visible");

    }

}


/*
==================================================
  NASTĘPNE MIASTO
==================================================
*/

async function nextRound() {

    await loadCity();

}


/*
==================================================
  MENU
==================================================
*/

function backToStart() {

    clearInterval(timerInterval);

    gameRunning = false;

    game.style.display = "none";

    startScreen.style.display = "block";

}


/*
==================================================
  STATYSTYKI
==================================================
*/

function updateStats() {

    document.getElementById("score")
        .innerText = score;

    document.getElementById("streak")
        .innerText = streak;

    document.getElementById("time")
        .innerText = timeLeft;

}


/*
==================================================
  ENTER = SPRAWDŹ
==================================================
*/

answer.addEventListener(
    "keydown",
    function(event) {

        if(event.key === "Enter") {

            event.preventDefault();

            checkAnswer();

        }

    }
);


/*
==================================================
  OBSŁUGA BŁĘDU ZDJĘCIA
==================================================
*/

cityImage.addEventListener(
    "error",
    function() {

        cityImage.style.display = "none";

        imagePlaceholder.style.display = "flex";

        credit.style.display = "none";

    }
);


/*
==================================================
  OBSŁUGA POPRAWNEGO ZDJĘCIA
==================================================
*/

cityImage.addEventListener(
    "load",
    function() {

        cityImage.style.display = "block";

        imagePlaceholder.style.display = "none";

    }
);

</script>

</body>
</html>
