<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zgadnij Miasto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #ffffff;
    padding: 18px 20px;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 900px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: 800;
}

.stats {
    display: flex;
    gap: 10px;
}

.stat {
    background: #f1f3f5;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
}

main {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 15px 40px;
}

.game-card {
    background: white;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}

.image-container {
    position: relative;
    background: #ddd;
    height: 430px;
}

#cityImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.image-credit {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,.65);
    color: white;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 11px;
}

.content {
    padding: 25px;
}

.question {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 20px;
}

.hints {
    display: grid;
    gap: 10px;
    margin-bottom: 20px;
}

.hint {
    background: #f6f7f9;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid #e8eaed;
    display: none;
}

.hint.visible {
    display: block;
}

.hint-number {
    font-weight: 800;
    margin-right: 5px;
}

.answer-row {
    display: flex;
    gap: 10px;
}

#answer {
    flex: 1;
    padding: 15px;
    border: 2px solid #e1e5e9;
    border-radius: 13px;
    font-size: 16px;
    outline: none;
}

#answer:focus {
    border-color: #222;
}

button {
    border: none;
    border-radius: 13px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

#checkBtn {
    background: #111827;
    color: white;
}

#hintBtn {
    background: #e9ecef;
    color: #111827;
    margin-top: 10px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result {
    margin-top: 15px;
    padding: 15px;
    border-radius: 13px;
    display: none;
    font-weight: 700;
}

.result.correct {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.result.wrong {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.next-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    background: #2563eb;
    color: white;
}

.timer {
    height: 5px;
    background: #e5e7eb;
}

.timer-bar {
    height: 100%;
    width: 100%;
    background: #111827;
    transition: width 1s linear;
}

.loading {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.9);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
}

.start-screen {
    text-align: center;
    background: white;
    border-radius: 22px;
    padding: 45px 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}

.start-screen h1 {
    font-size: 40px;
    margin: 0 0 10px;
}

.start-screen p {
    color: #667085;
    margin-bottom: 30px;
}

.start-btn {
    background: #111827;
    color: white;
    padding: 16px 28px;
}

.mode-select {
    margin: 20px auto;
    max-width: 300px;
}

.mode-select select {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 15px;
}

@media(max-width: 650px) {

    .image-container {
        height: 300px;
    }

    .question {
        font-size: 21px;
    }

    .answer-row {
        flex-direction: column;
    }

    #checkBtn {
        width: 100%;
    }

    .start-screen h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            🌍 Zgadnij Miasto
        </div>

        <div class="stats">
            <div class="stat">
                🎯 <span id="score">0</span>
            </div>

            <div class="stat">
                🔥 <span id="streak">0</span>
            </div>

            <div class="stat">
                ⏱️ <span id="time">60</span>
            </div>
        </div>

    </div>
</header>

<main>

    <section id="startScreen" class="start-screen">

        <h1>🌍 Zgadnij Miasto</h1>

        <p>
            Zobacz zdjęcie, wykorzystaj podpowiedzi
            i spróbuj odgadnąć miasto!
        </p>

        <div class="mode-select">

            <select id="mode">
                <option value="world">🌍 Cały świat</option>
                <option value="poland">🇵🇱 Polska</option>
                <option value="europe">🇪🇺 Europa</option>
            </select>

        </div>

        <button class="start-btn" onclick="startGame()">
            ROZPOCZNIJ GRĘ
        </button>

    </section>


    <section id="game" class="game-card" style="display:none">

        <div class="image-container">

            <img id="cityImage" alt="Zdjęcie miasta">

            <div id="loading" class="loading">
                Ładowanie miasta...
            </div>

            <div id="credit" class="image-credit">
                Wikimedia Commons
            </div>

        </div>

        <div class="timer">
            <div id="timerBar" class="timer-bar"></div>
        </div>

        <div class="content">

            <div class="question">
                🧐 Jakie to miasto?
            </div>

            <div class="hints">

                <div id="hint1" class="hint">
                    <span class="hint-number">💡 1.</span>
                    <span></span>
                </div>

                <div id="hint2" class="hint">
                    <span class="hint-number">💡 2.</span>
                    <span></span>
                </div>

                <div id="hint3" class="hint">
                    <span class="hint-number">💡 3.</span>
                    <span></span>
                </div>

            </div>

            <div class="answer-row">

                <input
                    id="answer"
                    type="text"
                    placeholder="Wpisz nazwę miasta..."
                    autocomplete="off"
                >

                <button id="checkBtn" onclick="checkAnswer()">
                    SPRAWDŹ
                </button>

            </div>

            <button id="hintBtn" onclick="showHint()">
                💡 POKAŻ PODPOWIEDŹ
            </button>

            <div id="result" class="result"></div>

            <button id="nextBtn" class="next-btn" onclick="nextRound()">
                NASTĘPNE MIASTO →
            </button>

        </div>

    </section>

</main>


<script>

const WORKER_URL = "TU_WKLEJ_ADRES_WORKERA";

let currentCity = null;
let score = 0;
let streak = 0;
let hintsUsed = 0;
let timeLeft = 60;
let timerInterval = null;
let gameRunning = false;


/* =========================
   START GRY
========================= */

async function startGame() {

    score = 0;
    streak = 0;

    updateStats();

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("game").style.display = "block";

    await loadCity();

    startTimer();
}


/* =========================
   POBIERANIE MIASTA
========================= */

async function loadCity() {

    clearInterval(timerInterval);

    gameRunning = true;

    hintsUsed = 0;

    document.getElementById("loading").style.display = "flex";

    document.getElementById("result").className = "result";
    document.getElementById("result").innerText = "";

    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("checkBtn").disabled = false;

    document.getElementById("hintBtn").disabled = false;

    document.getElementById("answer").value = "";

    for(let i = 1; i <= 3; i++) {

        const element = document.getElementById("hint" + i);

        element.classList.remove("visible");

        element.querySelector("span:last-child").innerText = "";

    }


    const mode = document.getElementById("mode").value;

    try {

        const response = await fetch(
            `${WORKER_URL}/api/city?mode=${mode}`
        );

        if(!response.ok) {
            throw new Error("API error");
        }

        currentCity = await response.json();

        document.getElementById("cityImage").src =
            currentCity.image;

        document.getElementById("credit").innerText =
            currentCity.credit || "Wikimedia Commons";

        document.getElementById("hint1")
            .querySelector("span:last-child").innerText =
            currentCity.hints[0];

        document.getElementById("hint2")
            .querySelector("span:last-child").innerText =
            currentCity.hints[1];

        document.getElementById("hint3")
            .querySelector("span:last-child").innerText =
            currentCity.hints[2];

        document.getElementById("loading").style.display = "none";

        document.getElementById("answer").focus();

        resetTimer();

    } catch(error) {

        console.error(error);

        document.getElementById("loading").innerText =
            "❌ Nie udało się pobrać miasta.";

    }
}


/* =========================
   PODPOWIEDZI
========================= */

function showHint() {

    if(!gameRunning) return;

    if(hintsUsed >= 3) return;

    hintsUsed++;

    document.getElementById(
        "hint" + hintsUsed
    ).classList.add("visible");

    if(hintsUsed >= 3) {

        document.getElementById("hintBtn").disabled = true;

    }

}


/* =========================
   SPRAWDZANIE
========================= */

function normalize(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


function checkAnswer() {

    if(!gameRunning) return;

    const answer =
        normalize(document.getElementById("answer").value);

    if(!answer) return;

    const correct =
        normalize(currentCity.city);

    if(answer === correct) {

        correctAnswer();

    } else {

        wrongAnswer();

    }

}


/* =========================
   DOBRA ODPOWIEDŹ
========================= */

function correctAnswer() {

    gameRunning = false;

    clearInterval(timerInterval);

    let points = 100;

    if(hintsUsed === 1) points = 75;

    if(hintsUsed === 2) points = 50;

    if(hintsUsed === 3) points = 25;

    if(timeLeft <= 15) points += 10;

    score += points;

    streak++;

    updateStats();

    const result =
        document.getElementById("result");

    result.className = "result correct";

    result.innerHTML =
        `🎉 Brawo! To <strong>${currentCity.city}</strong>! +${points} punktów`;

    document.getElementById("checkBtn").disabled = true;

    document.getElementById("hintBtn").disabled = true;

    document.getElementById("nextBtn").style.display = "block";

}


/* =========================
   ZŁA ODPOWIEDŹ
========================= */

function wrongAnswer() {

    streak = 0;

    updateStats();

    const result =
        document.getElementById("result");

    result.className = "result wrong";

    result.innerText =
        "❌ Nie tym razem! Spróbuj ponownie.";

}


/* =========================
   CZAS
========================= */

function startTimer() {

    clearInterval(timerInterval);

    timeLeft = 60;

    updateStats();

    timerInterval = setInterval(() => {

        if(!gameRunning) return;

        timeLeft--;

        updateStats();

        document.getElementById("timerBar").style.width =
            (timeLeft / 60 * 100) + "%";

        if(timeLeft <= 0) {

            timeOut();

        }

    }, 1000);

}


function resetTimer() {

    timeLeft = 60;

    updateStats();

    document.getElementById("timerBar").style.width = "100%";

    startTimer();

}


/* =========================
   KONIEC CZASU
========================= */

function timeOut() {

    gameRunning = false;

    clearInterval(timerInterval);

    streak = 0;

    updateStats();

    const result =
        document.getElementById("result");

    result.className = "result wrong";

    result.innerHTML =
        `⏰ Koniec czasu! To było <strong>${currentCity.city}</strong>.`;

    document.getElementById("checkBtn").disabled = true;

    document.getElementById("hintBtn").disabled = true;

    document.getElementById("nextBtn").style.display = "block";

}


/* =========================
   NASTĘPNE MIASTO
========================= */

async function nextRound() {

    await loadCity();

}


/* =========================
   STATYSTYKI
========================= */

function updateStats() {

    document.getElementById("score").innerText =
        score;

    document.getElementById("streak").innerText =
        streak;

    document.getElementById("time").innerText =
        timeLeft;

}


/* ENTER = SPRAWDŹ */

document.getElementById("answer")
    .addEventListener("keydown", function(event) {

        if(event.key === "Enter") {

            checkAnswer();

        }

    });

</script>

</body>
  </html>
